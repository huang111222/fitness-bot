- name: Install jq
  run: sudo apt-get install -y jq
  name: Daily Fitness

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send WeChat
        run: |
          curl -s "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=53ab5af5-b293-4dcc-ad40-fc6508c48924" \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype":"text",
            "text":{
              "content":""🏋️ 今日训练已生成\n\n📌 励志语录：\n"$(curl -s https://api.quotable.io/random | jq -r '.content')"\n\n🔥 今日训练：\nGitHub自动任务已执行成功""
            }
          }'
