name: Daily Fitness

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Send WeChat Message
        run: |
          QUOTE="Discipline is the bridge between goals and results."
          CN="自律是目标与结果之间的桥梁"

          MSG="🏋️ 今日训练计划

🔥 励志语录
EN: $QUOTE
CN: $CN

🔥 训练内容
热身10分钟
壶铃训练
哑铃训练
骑行30分钟
核心训练"

          curl -s "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=53ab5af5-b293-4dcc-ad40-fc6508c48924" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}"
